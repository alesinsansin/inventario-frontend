<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario NoSQL</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:8px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    box-sizing:border-box;
}

button{
    padding:10px;
    border:none;
    cursor:pointer;
    color:white;
    font-weight:bold;
}

#btnGuardar{
    width:100%;
    background:#0066cc;
}

#btnGuardar:hover{
    background:#004d99;
}

.btn-editar{
    background:#f39c12;
    margin-right:5px;
}

.btn-eliminar{
    background:#e74c3c;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
}

th{
    background:#0066cc;
    color:white;
}
</style>

</head>
<body>

<div class="container">

<h2>Panel de Inventario</h2>

<div class="card">

<h3 id="tituloFormulario">Registrar Producto</h3>

<form id="formProducto">

<input type="hidden" id="productoId">

<input
type="text"
id="nombre"
placeholder="Nombre del artículo"
required
>

<input
type="number"
id="precio"
placeholder="Precio"
required
>

<input
type="number"
id="existencia"
placeholder="Cantidad"
required
>

<button type="submit" id="btnGuardar">
Enviar a la Nube
</button>

</form>

</div>

<div class="card">

<h3>Existencias en Base de Datos</h3>

<table>

<thead>
<tr>
<th>Artículo</th>
<th>Precio</th>
<th>Stock</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tabla"></tbody>

</table>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
